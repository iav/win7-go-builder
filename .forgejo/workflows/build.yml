          mkdir -p /opt/go-win7 && unzip -q /tmp/go.zip -d /opt/go-win7 && rm /tmp/go.zip
          export PATH="/opt/go-win7/bin:$PATH" GOROOT="/opt/go-win7" GOPATH="${GITHUB_WORKSPACE}/go"
          export GOFLAGS="-buildvcs=false" CGO_ENABLED=0 WORKSPACE="${GITHUB_WORKSPACE}"
          export RESTIC_VERSION="${{ inputs.restic_version }}"
          chmod +x build.sh && ./build.sh restic:386
          ls -lah output/ && file output/*.exe
          for f in output/restic-*-win7-32.exe; do [ -f "$f" ] && echo "ARTIFACT_NAME=$(basename $f .exe)" >> $GITHUB_ENV; done
